# Runs the whole test suite on Linux and on macOS. The plugin's build commands
# are shell run on the user's machine, and macOS's differs from Linux's in ways
# a Linux-only run never sees: /bin/bash there is 3.2, which cannot parse a
# case pattern inside $(...) unless it opens with "(".
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4

      - name: The bash plz runs actions with is macOS's own 3.2
        if: runner.os == 'macOS'
        run: |
          # plz's default build path; a newer bash first on it would make this
          # job stop testing what a developer's Mac runs.
          v=$(PATH=/usr/local/bin:/usr/bin:/bin bash -c 'echo $BASH_VERSION')
          echo "bash on plz's path: $v"
          case "$v" in (3.*) ;; (*) echo "expected bash 3.x, got $v"; exit 1;; esac

      - name: Test
        run: ./pleasew test //...
